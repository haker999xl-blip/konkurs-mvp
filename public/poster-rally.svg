<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="Кибертурнир: шахматная ладья, доска и часы">
  <defs>
    <linearGradient id="bgR" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3D6B96"/><stop offset="1" stop-color="#1F3F5E"/></linearGradient>
  </defs>
  <style>
    .hand{transform-origin:640px 240px;animation:tick 6s linear infinite}
    @keyframes tick{to{transform:rotate(360deg)}}
    .hop{animation:hop 2.8s cubic-bezier(.3,.7,.3,1) infinite}
    @keyframes hop{0%,100%{transform:translateY(0)}18%{transform:translateY(-18px)}36%{transform:translateY(0)}}
    .sq{animation:sq 4s ease-in-out infinite alternate}
    @keyframes sq{from{opacity:.1}to{opacity:.24}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect width="800" height="520" fill="url(#bgR)"/>
  <!-- доска -->
  <g fill="#F4F2ED" class="sq">
    <rect x="40" y="90" width="80" height="80"/><rect x="200" y="90" width="80" height="80"/><rect x="360" y="90" width="80" height="80"/>
    <rect x="120" y="170" width="80" height="80"/><rect x="280" y="170" width="80" height="80"/>
    <rect x="40" y="250" width="80" height="80"/><rect x="200" y="250" width="80" height="80"/><rect x="360" y="250" width="80" height="80"/>
    <rect x="120" y="330" width="80" height="80"/><rect x="280" y="330" width="80" height="80"/>
    <rect x="40" y="410" width="80" height="80"/><rect x="200" y="410" width="80" height="80"/><rect x="360" y="410" width="80" height="80"/>
  </g>
  <!-- ладья -->
  <g class="hop">
    <path d="M250 140 h20 v22 h22 v-22 h20 v22 h22 v-22 h20 v52 h-104 z" fill="#FBF3E6" fill-opacity=".14"/>
    <g fill="none" stroke="#FBF3E6" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
      <path d="M236 150 v-22 h24 v18 h22 v-18 h36 v18 h22 v-18 h24 v22 l-16 26 h-96 z"/>
      <path d="M252 176 l-10 118 h156 l-10 -118"/>
      <path d="M222 294 h184 v32 h-184 z"/>
      <path d="M208 326 h212 v26 h-212 z"/>
    </g>
    <circle cx="314" cy="236" r="9" fill="#E9C57F"/>
  </g>
  <!-- часы -->
  <circle cx="640" cy="240" r="96" fill="#F4F2ED" fill-opacity=".08"/>
  <circle cx="640" cy="240" r="96" fill="none" stroke="#FBF3E6" stroke-width="7"/>
  <g stroke="#FBF3E6" stroke-opacity=".6" stroke-width="5" stroke-linecap="round"><path d="M640 160 v14"/><path d="M640 306 v14"/><path d="M560 240 h14"/><path d="M706 240 h14"/></g>
  <path d="M640 240 L640 190" stroke="#FBF3E6" stroke-width="7" stroke-linecap="round" transform="rotate(40 640 240)"/>
  <g class="hand"><path d="M640 240 V172" stroke="#E9C57F" stroke-width="5" stroke-linecap="round"/></g>
  <circle cx="640" cy="240" r="8" fill="#E9C57F"/>
</svg>
