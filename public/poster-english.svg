<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="SpeakUp: два диалоговых облака и звуковая волна">
  <defs>
    <linearGradient id="bgE" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9A7632"/><stop offset="1" stop-color="#5A4220"/></linearGradient>
  </defs>
  <style>
    .dot{animation:dot 1.2s ease-in-out infinite}.d2{animation-delay:.2s}.d3{animation-delay:.4s}
    @keyframes dot{0%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-9px);opacity:1}}
    .bar{transform-box:fill-box;transform-origin:center;animation:bar 1.1s ease-in-out infinite alternate}
    .b2{animation-delay:-.2s}.b3{animation-delay:-.45s}.b4{animation-delay:-.7s}.b5{animation-delay:-.9s}
    @keyframes bar{from{transform:scaleY(.35)}to{transform:scaleY(1.15)}}
    .pop{transform-box:fill-box;transform-origin:left bottom;animation:pop 5s ease-out infinite}
    @keyframes pop{0%{transform:scale(.7);opacity:0}12%,85%{transform:scale(1);opacity:1}100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect width="800" height="520" fill="url(#bgE)"/>
  <circle cx="710" cy="100" r="150" fill="#F4F2ED" fill-opacity=".1"/><circle cx="80" cy="480" r="110" fill="#F4F2ED" fill-opacity=".1"/>
  <g transform="translate(56 40) scale(.86)">
  <!-- левое облако -->
  <g class="pop">
    <path d="M110 150 h250 a40 40 0 0 1 40 40 v70 a40 40 0 0 1 -40 40 h-150 l-62 48 v-48 h-38 a40 40 0 0 1 -40 -40 v-70 a40 40 0 0 1 40 -40 z" fill="#FBF3E6" fill-opacity=".16" stroke="#FBF3E6" stroke-width="6" stroke-linejoin="round"/>
    <text x="130" y="248" font-family="Georgia,'Times New Roman',serif" font-size="68" font-weight="700" fill="#FBF3E6">Hello!</text>
  </g>
  <!-- правое облако -->
  <path d="M440 260 h230 a40 40 0 0 1 40 40 v60 a40 40 0 0 1 -40 40 h-18 v44 l-58 -44 h-154 a40 40 0 0 1 -40 -40 v-60 a40 40 0 0 1 40 -40 z" fill="#FBF3E6" fill-opacity=".1" stroke="#FBF3E6" stroke-width="6" stroke-linejoin="round" stroke-opacity=".9"/>
  <g fill="#E9C57F"><circle class="dot" cx="520" cy="330" r="10"/><circle class="dot d2" cx="560" cy="330" r="10"/><circle class="dot d3" cx="600" cy="330" r="10"/></g>
  <!-- волна голоса -->
  <g stroke="#E9C57F" stroke-width="10" stroke-linecap="round">
    <path class="bar" d="M440 118 v48"/><path class="bar b2" d="M470 100 v84"/><path class="bar b3" d="M500 112 v60"/><path class="bar b4" d="M530 94 v96"/><path class="bar b5" d="M560 116 v52"/>
  </g>
</g>
</svg>
